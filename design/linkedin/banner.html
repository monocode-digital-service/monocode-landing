<!doctype html>
<!-- Capa da página do LinkedIn (1128x191, exportada em 2x). O logo do perfil cobre o canto inferior esquerdo. -->
<html lang="pt-BR">
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600&family=Geist+Mono&display=block" rel="stylesheet" />
<style>
	* { margin: 0; box-sizing: border-box; }
	body {
		width: 1128px; height: 191px; overflow: hidden; position: relative;
		background: #0a2a1b; color: #f7f9f7; font-family: Manrope, sans-serif;
	}
	.rings {
		position: absolute; inset: -200px -100px -200px 55%;
		background:
			repeating-radial-gradient(ellipse 60% 45% at 62% 48%, transparent 0 21px, rgb(146 255 95 / 0.34) 21px 22px),
			radial-gradient(ellipse 60% 45% at 62% 48%, #14502f 0%, transparent 70%);
		-webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 45%);
	}
	.text { position: absolute; left: 260px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
	h1 { font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -0.045em; }
	p { font-family: "Geist Mono", monospace; font-size: 13px; color: #92ff5f; }
	p span { color: rgb(247 249 247 / 0.45); }
</style>
<div class="rings"></div>
<div class="text">
	<h1>Coloque a IA para trabalhar<br />na sua empresa.</h1>
	<p><span>~/monocode/</span>agentes-de-ia · automacoes · aplicacoes-sob-medida</p>
</div>
</html>
